services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dentivohq
      POSTGRES_USER: dentivohq
      POSTGRES_PASSWORD: dentivohq
    ports:
      - "5432:5432"
    volumes:
      - dentivohq-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentivohq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dentivohq-postgres:
